<!doctype html><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box} :root{--paper:#F7F3E8;--ink:#14181F;--saf:#E8A13B;--grn:#2E7D32}
body{width:1000px;height:700px;background:var(--paper);font-family:"Nirmala UI",sans-serif;text-align:center;overflow:hidden}
.tape{height:24px;background:repeating-linear-gradient(45deg,var(--saf) 0 30px,var(--ink) 30px 60px)}
.big{font-size:120px;font-weight:700;color:var(--ink);margin-top:30px;line-height:1}
.wa{display:inline-block;margin-top:18px;background:var(--grn);color:#fff;font-weight:700;font-size:44px;padding:10px 34px;border-radius:16px}
.num{font-family:Consolas,monospace;font-size:58px;font-weight:700;margin-top:26px;color:var(--ink);letter-spacing:2px}
.step{font-size:30px;margin-top:22px;color:#4a4436}
.code{font-family:Consolas,monospace;font-weight:700;background:#fff;border:5px solid var(--ink);padding:6px 22px;font-size:38px}
.ft{font-family:Consolas,monospace;font-size:24px;color:#6E6551;margin-top:30px;letter-spacing:4px}
</style>
<div class="tape"></div>
<div class="big">ढाल</div>
<div class="wa">WhatsApp पर भी 🛡️</div>
<div class="num">+1 (737) 250-8034</div>
<div class="step">1️⃣ भेजें: <span class="code">join twilio-trial</span></div>
<div class="step">2️⃣ कोई भी suspicious message forward करें — <b>तुरंत जाँच वापस</b></div>
<div class="ft">FORWARD THE SCAM · GET THE VERDICT · MUJ HACKX 4.0</div>
<div class="tape" style="position:fixed;bottom:0;left:0;right:0"></div>
