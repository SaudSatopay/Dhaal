<!doctype html><meta charset="utf-8">
<style>
  :root { --paper:#F7F3E8; --ink:#14181F; --saffron:#E8A13B; --dim:#6E6551; }
  * { margin:0; box-sizing:border-box; }
  body { width:1000px; height:1400px; background:var(--paper); font-family:"Nirmala UI",sans-serif; overflow:hidden; text-align:center; }
  .tape { height:26px; background:repeating-linear-gradient(45deg, var(--saffron) 0 30px, var(--ink) 30px 60px); }
  .big { font-size:170px; font-weight:700; color:var(--ink); margin-top:48px; line-height:1; }
  .tag { font-size:48px; font-weight:700; color:var(--ink); margin-top:22px; }
  .en  { font-size:30px; color:var(--dim); margin-top:14px; }
  .qr  { margin-top:44px; }
  .qr img { width:600px; height:600px; border:14px solid var(--ink); padding:16px; background:#fff; }
  .url { font-family:Consolas,monospace; font-size:40px; font-weight:700; color:var(--ink); margin-top:40px; letter-spacing:1px; }
  .ft  { font-family:Consolas,monospace; font-size:28px; color:var(--dim); margin-top:26px; letter-spacing:4px; }
</style>
<div class="tape"></div>
<div class="big">ढाल</div>
<div class="tag">पैसे भेजने से पहले — एक जाँच।</div>
<div class="en">Scan. Paste any message. Know before you pay.</div>
<div class="qr"><img src="qr-plain.png" alt="QR"></div>
<div class="url">dhaal-delta.vercel.app</div>
<div class="ft">MUJ HACKX 4.0 · FINTECH PS#7</div>
<div class="tape" style="position:fixed;bottom:0;left:0;right:0"></div>
